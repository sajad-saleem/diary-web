<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Personal Diary — Firebase</title>

  <!-- Tailwind CDN for quick styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Indie+Flower&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .glass { background: rgba(255,255,255,0.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .note { min-height: 96px; transition: transform .12s, box-shadow .12s; cursor: default; }
    .note:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
    .handwriting { font-family: 'Indie Flower', cursive; }
    .modal-backdrop { background: rgba(0,0,0,0.5); }
    .sticky-tilt { transform: rotate(-1.5deg); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-300 via-violet-300 to-pink-300 flex items-start justify-center p-6">

  <div class="w-full max-w-4xl">
    <div id="alert" class="hidden mb-4 text-center"></div>

    <!-- AUTH CARD -->
    <div id="authCard" class="glass rounded-2xl shadow-lg p-8">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-2xl font-bold text-indigo-700">My Personal Diary</h1>
          <p class="text-sm text-gray-600">Private · Secure · Cloud</p>
        </div>
        <div class="text-sm text-gray-500">Firebase edition</div>
      </div>

      <div id="authForms" class="grid gap-6">
        <!-- REGISTER -->
        <div id="registerPanel">
          <h2 class="text-lg font-medium text-gray-700">Create account</h2>
          <input id="regEmail" type="email" class="w-full p-3 rounded-xl border" placeholder="Email">
          <input id="regPass" type="password" class="w-full p-3 rounded-xl border" placeholder="Password (min 6 chars)">
          <div class="flex gap-3 mt-3">
            <button id="btnRegister" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl">Register</button>
            <button id="btnShowLogin" class="flex-1 border border-indigo-600 text-indigo-600 py-2 rounded-xl">Login instead</button>
          </div>
        </div>

        <!-- LOGIN -->
        <div id="loginPanel" class="hidden">
          <h2 class="text-lg font-medium text-gray-700">Welcome back</h2>
          <input id="logEmail" type="email" class="w-full p-3 rounded-xl border" placeholder="Email">
          <input id="logPass" type="password" class="w-full p-3 rounded-xl border" placeholder="Password">
          <div class="flex gap-3 mt-3">
            <button id="btnLogin" class="flex-1 bg-green-600 text-white py-2 rounded-xl">Login</button>
            <button id="btnShowRegister" class="flex-1 border border-green-600 text-green-600 py-2 rounded-xl">Register</button>
          </div>
        </div>
      </div>
    </div>

    <!-- DIARY CARD -->
    <div id="diaryCard" class="hidden mt-6 glass rounded-2xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 id="welcome" class="text-xl font-bold text-indigo-700">Hello</h2>
          <p id="sub" class="text-sm text-gray-500">Your private journal — saved to Firebase</p>
        </div>
        <div class="flex gap-3 items-center">
          <input id="search" type="text" placeholder="Search title or content..." class="p-2 rounded-lg border">
          <button id="btnLogout" class="px-4 py-2 rounded-lg bg-red-500 text-white">Logout</button>
        </div>
      </div>

      <textarea id="entryBody" rows="5" class="w-full p-4 rounded-xl border" placeholder="Write something you want to remember..."></textarea>
      <div class="flex gap-3 mt-3">
        <input id="entryTitle" class="flex-1 p-3 rounded-xl border" placeholder="Title (optional)" />
        <button id="btnSave" class="px-5 py-3 rounded-xl bg-indigo-600 text-white">Save</button>
      </div>

      <h3 class="mt-6 font-semibold text-gray-700">Your entries</h3>
      <div id="notes" class="mt-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div id="confirmModal" class="hidden fixed inset-0 flex items-center justify-center z-50">
    <div class="modal-backdrop absolute inset-0"></div>
    <div class="relative z-10 w-full max-w-md p-6 bg-white rounded-xl">
      <h3 id="confirmTitle" class="text-lg font-semibold">Confirm</h3>
      <p id="confirmMessage" class="text-sm text-gray-600 mt-2"></p>
      <div class="flex justify-end gap-3 mt-6">
        <button id="confirmCancel" class="px-4 py-2 rounded-lg border">Cancel</button>
        <button id="confirmOk" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">Yes</button>
      </div>
    </div>
  </div>

  <!-- Firebase modular SDK (v9) -->
  <script type="module">
    // ---------------------------
    // IMPORTS
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      where,
      orderBy,
      onSnapshot,
      doc,
      deleteDoc,
      serverTimestamp,
      getDocs
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // ---------------------------
    // TODO: REPLACE WITH YOUR FIREBASE CONFIG
    // You can find this in Firebase Console -> Project settings -> SDK setup
    const firebaseConfig = {
      apiKey: "REPLACE_ME",
      authDomain: "REPLACE_ME.firebaseapp.com",
      projectId: "REPLACE_ME",
      storageBucket: "REPLACE_ME.appspot.com",
      messagingSenderId: "REPLACE_ME",
      appId: "REPLACE_ME"
    };

    // ---------------------------
    // INIT
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ---------------------------
    // UI helpers & elements
    const $ = id => document.getElementById(id);
    const showAlert = (msg, type = 'info') => {
      const el = $('alert');
      el.textContent = msg;
      el.className = 'mb-4 text-center p-2 rounded ' + (type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    };

    // modal promise
    function openConfirm(title, message) {
      return new Promise(resolve => {
        $('confirmTitle').textContent = title;
        $('confirmMessage').textContent = message;
        $('confirmModal').classList.remove('hidden');
        const ok = $('confirmOk');
        const cancel = $('confirmCancel');

        const clean = () => {
          $('confirmModal').classList.add('hidden');
          ok.removeEventListener('click', okFn);
          cancel.removeEventListener('click', cancelFn);
        };
        const okFn = () => { clean(); resolve(true); };
        const cancelFn = () => { clean(); resolve(false); };

        ok.addEventListener('click', okFn);
        cancel.addEventListener('click', cancelFn);
      });
    }

    // ---------------------------
    // Auth UI wiring
    $('btnShowLogin').addEventListener('click', () => { $('registerPanel').classList.add('hidden'); $('loginPanel').classList.remove('hidden'); });
    $('btnShowRegister').addEventListener('click', () => { $('loginPanel').classList.add('hidden'); $('registerPanel').classList.remove('hidden'); });

    $('btnRegister').addEventListener('click', async () => {
      const email = $('regEmail').value.trim();
      const pass = $('regPass').value;
      if (!email || !pass) { showAlert('Enter email and password', 'error'); return; }
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        showAlert('Registered — logged in', 'success');
      } catch (err) {
        showAlert(err.message || 'Register error', 'error');
      }
    });

    $('btnLogin').addEventListener('click', async () => {
      const email = $('logEmail').value.trim();
      const pass = $('logPass').value;
      if (!email || !pass) { showAlert('Enter email and password', 'error'); return; }
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showAlert('Login successful', 'success');
      } catch (err) {
        showAlert(err.message || 'Login error', 'error');
      }
    });

    $('btnLogout').addEventListener('click', async () => {
      const ok = await openConfirm('Log out', 'Do you really want to log out?');
      if (!ok) return;
      await signOut(auth);
      showAlert('Logged out', 'info');
    });

    // ---------------------------
    // Real-time entries for current user
    let unsubscribeEntries = null;
    function startEntriesListener(user) {
      if (unsubscribeEntries) unsubscribeEntries();
      const q = query(
        collection(db, 'entries'),
        where('userId', '==', user.uid),
        orderBy('createdAt', 'desc')
      );
      unsubscribeEntries = onSnapshot(q, snapshot => {
        const rows = [];
        snapshot.forEach(docSnap => {
          rows.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderNotes(rows);
      }, err => {
        console.error('entries snapshot error', err);
      });
    }

    // ---------------------------
    // Save entry
    $('btnSave').addEventListener('click', async () => {
      const title = $('entryTitle').value.trim() || 'Untitled';
      const content = $('entryBody').value.trim();
      if (!content) { showAlert('Write something first', 'error'); return; }

      const ok = await openConfirm('Save entry', 'Do you want to save this entry?');
      if (!ok) return;

      const user = auth.currentUser;
      if (!user) { showAlert('Not authenticated', 'error'); return; }

      try {
        await addDoc(collection(db, 'entries'), {
          userId: user.uid,
          title,
          content,
          createdAt: serverTimestamp()
        });
        $('entryTitle').value = '';
        $('entryBody').value = '';
        showAlert('Saved', 'success');
      } catch (err) {
        console.error('save entry err', err);
        showAlert('Save failed', 'error');
      }
    });

    // ---------------------------
    // Delete entry
    async function handleDelete(id) {
      const ok = await openConfirm('Delete entry', 'Are you sure you want to delete this entry?');
      if (!ok) return;
      try {
        await deleteDoc(doc(db, 'entries', id));
        showAlert('Deleted', 'success');
      } catch (err) {
        console.error('delete err', err);
        showAlert('Delete failed', 'error');
      }
    }

    // ---------------------------
    // Render notes (sticky note style) and search
    function renderNotes(rows) {
      const grid = $('notes');
      const q = ($('search').value || '').toLowerCase().trim();
      grid.innerHTML = '';
      if (!rows || rows.length === 0) {
        grid.innerHTML = '<div class="p-4 text-sm text-gray-500">No notes yet.</div>';
        return;
      }

      // colors and tilt
      const colorClasses = ['bg-yellow-50','bg-amber-50','bg-rose-50','bg-sky-50','bg-lime-50'];
      rows.forEach((r, i) => {
        const text = (r.title + ' ' + r.content).toLowerCase();
        if (q && !text.includes(q)) return; // filter client-side by title+content

        const card = document.createElement('article');
        card.className = `note p-4 rounded-xl ${colorClasses[i % colorClasses.length]} sticky-tilt`;
        card.style.transform = `rotate(${[-2,1,-1.5,2,-3,1.5,0][i % 7]}deg)`;

        const ts = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleString() : (r.createdAt ? new Date(r.createdAt.seconds ? r.createdAt.seconds*1000 : r.createdAt).toLocaleString() : '');

        card.innerHTML = `
          <div class="flex justify-between items-start gap-3">
            <div>
              <div class="font-semibold text-indigo-700">${escapeHtml(r.title || 'Untitled')}</div>
              <div class="text-xs text-gray-400">${escapeHtml(ts)}</div>
            </div>
            <div class="flex gap-2 items-center">
              <button class="text-sm px-2 py-1 rounded text-red-600 delete-btn">Delete</button>
            </div>
          </div>
          <div class="mt-3 handwriting text-gray-800">${escapeHtml(r.content)}</div>
        `;

        card.querySelector('.delete-btn').addEventListener('click', () => handleDelete(r.id));
        grid.appendChild(card);
      });
    }

    // ---------------------------
    // Helper escape
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    // ---------------------------
    // Wire search input to re-render (since onSnapshot handles real-time)
    $('search').addEventListener('input', () => {
      // we can't re-run query easily, so re-render last snapshot by forcing onSnapshot to call render - simplest is re-run a local fetch:
      (async () => {
        const user = auth.currentUser;
        if (!user) return;
        const qRef = query(collection(db, 'entries'), where('userId', '==', user.uid), orderBy('createdAt', 'desc'));
        const snap = await getDocs(qRef);
        const rows = [];
        snap.forEach(docSnap => rows.push({ id: docSnap.id, ...docSnap.data() }));
        renderNotes(rows);
      })();
    });

    // ---------------------------
    // Auth state watcher
    onAuthStateChanged(auth, user => {
      if (user) {
        // show diary UI, start listening
        $('authCard').classList.add('hidden');
        $('diaryCard').classList.remove('hidden');
        $('welcome').textContent = `Hi — ${user.email}`;
        startEntriesListener(user);
      } else {
        // show auth
        $('authCard').classList.remove('hidden');
        $('diaryCard').classList.add('hidden');
        if (unsubscribeEntries) { unsubscribeEntries(); unsubscribeEntries = null; }
      }
    });

    // ---------------------------
    // Firestore helpers used above but need imports
    // We already imported addDoc, collection, query, where, orderBy, onSnapshot, doc, deleteDoc, serverTimestamp, getDocs
    // but used deleteDoc and doc inside handleDelete: ensure they are imported above (yes).
  </script>
</body>
</html>
